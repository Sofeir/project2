<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/style.css"><style>:root{}
body{overflow:hidden;padding:0;margin:0}
.top{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{display:flex;height:calc(100vh - 44px)}.chk{width:46%;background:var(--panel);border-right:1px solid var(--line);padding:8px}
.cat{flex:1;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}.tile{height:92px}
.glare{position:fixed;inset:0;background:rgba(255,255,255,0);pointer-events:none}
</style></head><body>
<div class="top"><b style="font-size:14px">ASOFT <span style="color:var(--acc)">POS</span></b><span class="chip"><span class="dot"></span>ФН активен</span><div class="clock" style="margin-left:auto"><b class="num" style="font-size:14px">12:41:07</b><span>Смена №33 · 3 чека</span></div></div>
<div class="wrap"><div class="chk">
<div class="row"><div class="row-top"><div class="row-name">Бизнес-ланч</div><div class="row-sum num">390 ₽</div></div><div class="row-bot"><div class="row-price">1 × 390 ₽</div></div></div>
<div class="row is-sel"><div class="row-top"><div class="row-name">Детский обед</div><div class="row-sum num">210 ₽</div></div><div class="row-bot"><div class="row-price">1 × 210 ₽</div><div class="stepper"><button>−</button><button class="q num">1</button><button>+</button></div></div>
<div class="row-acts"><button>Кол-во</button><button class="danger">Удалить</button></div></div>
<div class="total" style="margin-top:14px"><span class="l">К оплате</span><span class="v num" style="font-size:30px">600 ₽</span></div>
<div class="pay-row"><button class="btn">Отложить</button><button class="btn btn-primary">Оплатить</button></div></div>
<div class="cat"><button class="tile combo in"><span class="qty num">1</span><span class="tag">КОМПЛЕКС</span><span class="nm">Детский обед</span><span class="bot"><span class="pr num">210 ₽</span><span class="un">/ компл</span></span></button>
<button class="tile" style="--c:#E07A6A"><span class="tag">ГОРЯЧЕЕ</span><span class="nm">Котлета куриная</span><span class="bot"><span class="pr num">95 ₽</span><span class="un">/ порц</span></span></button>
<button class="tile" style="--c:#7BA9D8"><span class="tag">НАПИТОК</span><span class="nm">Компот</span><span class="bot"><span class="pr num">40 ₽</span><span class="un">/ 200 мл</span></span></button>
<button class="tile" style="--c:#7FBE8C"><span class="tag">САЛАТ</span><span class="nm">Винегрет</span><span class="bot"><span class="pr num">65 ₽</span><span class="un">/ порц</span></span></button></div></div>
<div class="glare"></div></body></html>
